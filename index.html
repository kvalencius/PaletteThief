<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PP48 · Palette Thief</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23e63946'/%3E%3Ccircle cx='21' cy='13' r='4' fill='%23f1c453'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%232a9d8f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== NAVBAR / TOOLBAR ===================== -->
  <nav class="nav">
    <div class="nav-group">
      <button id="sidebar-toggle" class="icon-btn" title="Buka/tutup sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="nav-brand">PP48 <span class="nav-title">· Palette Thief</span></div>
    </div>
    <div class="nav-group nav-actions">
      <div id="status" class="status-pill" data-state="idle" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">Siap memuat gambar</span>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden />
    </div>
  </nav>

  <div class="app">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-scroll">

          <section class="section">
            <h3>Palet</h3>
            <div id="palette-list" class="palette-list"></div>
          </section>

          <section class="section">
            <h3>Ekspor</h3>
            <div class="btn-row">
              <button class="btn-ghost btn-sm" data-export="png" disabled>PNG</button>
              <button class="btn-ghost btn-sm" data-export="jpg" disabled>JPG</button>
              <button class="btn-ghost btn-sm" data-export="jpeg" disabled>JPEG</button>
              <button class="btn-ghost btn-sm" data-export="pdf" disabled>PDF</button>
            </div>
          </section>

          <button id="btn-reset" class="btn-ghost btn-block" disabled>Reset Gambar</button>

        </div>
      </div>
    </aside>

    <!-- ===================== STAGE ===================== -->
    <main class="stage" id="stage">
      <div id="empty-state" class="empty-state">
        <div class="empty-card">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/>
          </svg>
          <strong>Seret &amp; letakkan gambar di sini</strong>
          <span>atau klik untuk memilih dari file explorer</span>
        </div>
      </div>

      <div id="image-wrap" class="image-wrap" hidden>
        <img id="preview" alt="Pratinjau gambar" />
        <div id="markers"></div>
      </div>
    </main>
  </div>

  <!-- ===================== TOOLTIP / TOAST / OVERLAY ===================== -->
  <div id="tooltip" class="tip" role="tooltip"></div>
  <div id="toast" class="toast"></div>
  <div id="drop-overlay" class="drop-overlay">Lepaskan gambar untuk memuat</div>

  <script src="vendor/color-thief.global.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
